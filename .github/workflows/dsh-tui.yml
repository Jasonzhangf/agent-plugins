name: agent-tui

on:
  pull_request:
    paths:
      - 'agent-tui/**'
      - '.github/workflows/dsh-tui.yml'
  push:
    paths:
      - 'agent-tui/**'
      - '.github/workflows/dsh-tui.yml'

jobs:
  verify:
    runs-on: macos-14
    defaults:
      run:
        working-directory: agent-tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: corepack enable
      # AppSDK remains a required local governance gate; hosted CI validates
      # the package/runtime gates below without installing or running AppSDK.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build:runtime
      - run: node --import tsx --test tests/*/*.spec.ts
      - run: pnpm run check:public-exports
      - run: pnpm run check:clean-install
      - run: pnpm run check:runtime-boundaries
