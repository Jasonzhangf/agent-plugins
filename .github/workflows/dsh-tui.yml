name: agent-tui

on:
  pull_request:
    paths:
      - 'agent-tui/**'
      - '.github/workflows/dsh-tui.yml'
  push:
    paths:
      - 'agent-tui/**'
      - '.github/workflows/dsh-tui.yml'

jobs:
  verify:
    runs-on: macos-14
    defaults:
      run:
        working-directory: agent-tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: corepack enable
      - name: Install AppSDK 0.1.6 from canonical source
        run: |
          cargo install --git https://github.com/Jasonzhangf/appsdk.git --branch main --locked --root "$RUNNER_TEMP/appsdk"
          echo "$RUNNER_TEMP/appsdk/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: node --import tsx --test tests/*/*.spec.ts
      - run: pnpm run build:runtime
      - run: pnpm run check:public-exports
      - run: pnpm run check:clean-install
      - run: pnpm run check:runtime-boundaries
