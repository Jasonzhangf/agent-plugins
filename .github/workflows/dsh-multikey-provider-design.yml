name: dsh-multikey-provider-design

on:
  pull_request:
    paths:
      - 'dsh-multikey-provider/docs/**'
      - 'dsh-multikey-provider/outputs/**'
      - 'dsh-multikey-provider/cordis.patch.yml'
      - 'dsh-multikey-provider/package.json'
      - 'dsh-multikey-provider/scripts/verify-architecture.mjs'
      - '.github/workflows/dsh-multikey-provider-design.yml'
  push:
    paths:
      - 'dsh-multikey-provider/docs/**'
      - 'dsh-multikey-provider/outputs/**'
      - 'dsh-multikey-provider/cordis.patch.yml'
      - 'dsh-multikey-provider/package.json'
      - 'dsh-multikey-provider/scripts/verify-architecture.mjs'
      - '.github/workflows/dsh-multikey-provider-design.yml'

jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: |
          if rg -q '"status": "design"' dsh-multikey-provider/docs/architecture/*.json; then
            node dsh-multikey-provider/docs/architecture/verify-design.mjs
          else
            echo 'Design phase complete; active registries drive the active gate.'
          fi
