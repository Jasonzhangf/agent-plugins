name: dsh-multikey-provider-design

on:
  pull_request:
    paths:
      - 'dsh-multikey-provider/**'
      - '.github/workflows/dsh-multikey-provider-design.yml'
  push:
    paths:
      - 'dsh-multikey-provider/**'
      - '.github/workflows/dsh-multikey-provider-design.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: dsh-multikey-provider
      - run: |
          if rg -q '"status": "design"' dsh-multikey-provider/docs/architecture/*.json; then
            node dsh-multikey-provider/docs/architecture/verify-design.mjs
          else
            pnpm --dir dsh-multikey-provider run check
          fi
