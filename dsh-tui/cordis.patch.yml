# Persistent dual-surface layer over DSH's shipped web profile. The combined
# startup row replaces the Web-only parser and provides both services. All
# other Web rows remain owned by the shipped Web bundle.

- id: web-startup
  disabled: true

- insert:
    - id: tui-startup
      name: 'dsh-tui/startup'

    - id: tui-runtime
      name: 'dsh-tui'
      inject: [tuiStartup]
      config:
        resumeSessionId: !!js ctx.tuiStartup.resumeSessionId
