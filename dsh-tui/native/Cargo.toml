[package]
name = "dsh-tui"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "dsh-tui"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", default-features = false, features = ["events", "bracketed-paste"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
unicode-width = "=0.2.0"
