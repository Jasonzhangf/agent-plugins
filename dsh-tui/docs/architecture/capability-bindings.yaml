rules:
  - Each binding row owns exactly one capability_id.
  - ISessions, ISession, SessionFace, and IWorkspaces are forbidden as TUI host operation owners.
  - A blocked row is design evidence only; runtime stubs, private imports, copied implementations, fake success, and empty projections are forbidden.
  - An n_a row is valid only with approval_status approved, approved_by Jason, and a concrete n_a_reason.
  - Every bound row resolves through one declared binding default or provides one exact public package export and types artifact.
  - Bound means verified against the local built checkout artifact. No DSH package at 0.1.0-rc.5 is published in the configured npm registry, so runtime admission remains blocked until an installable artifact set provides the same exports.
  - Approval fixes the disposition and owner scope; a projection row remains blocked until its owner export is verified from a clean registry installation.
  - Codec and runtime remain blocked unless implementation_admission requirements all pass; DSH Review, commit, and upload belong only to release_admission.
  - Missing ./presentation or ./markdown exports block their capability and require load-time failure once runtime composition exists.

verification_gates:
  - gate.maps.references
  - gate.architecture.boundaries
