    capability_status: blocked
    approval_status: approved
    approved_by: Jason
    approved_disposition: owner_export_required
    implementation_owner_migration: forbidden
    owner: upstream.client.runtime.conversation
    package: '@deepseek-ai/dsh-client-runtime'
    package_version: 0.1.0-rc.5
    export_path: './presentation'
    symbol: ConversationNodeAssembler
    direction: read_projection
    scope: Incremental assembly engine only; business definitions remain with their packages.
    blocking_owner: '@deepseek-ai/dsh-client-runtime'
    required_export: './presentation'
    required_symbols: [ConversationEventRegistry, ConversationViewRegistry, ConversationNodeAssembler]
    release_prerequisite: Publish a platform-neutral ./presentation face that does not mount the Web client runtime or expose ISessions, ISession, or IWorkspaces.
    planned_path: src/presentation/runtime.ts
    gate: gate.maps.references

  - capability_id: transcript.core
    capability_status: blocked
    approval_status: approved
    approved_by: Jason
    approved_disposition: owner_export_required
