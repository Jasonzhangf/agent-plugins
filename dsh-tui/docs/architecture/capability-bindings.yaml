    approved_by: Jason
    approved_disposition: owner_exports_required
    plugin_tool_pairing: forbidden
    plugin_tool_name_dispatch: forbidden
    owner: upstream.presentation.composition
    package: '@deepseek-ai/dsh-client-ui-tool'
    package_version: 0.1.0-rc.5
    export_path: './presentation'
    symbol: ToolPresentationModel
    direction: read_projection
    scope: dsh-tools owns intent; ui-conversation owns call/result pairing and nested topology; ui-tool owns the terminal-neutral presentation model.
    blocking_owner: upstream.presentation.composition
    required_export: './presentation'
    required_symbols: [ToolCallView, ToolResultView, toolDefinition, ToolPresentationModel]
