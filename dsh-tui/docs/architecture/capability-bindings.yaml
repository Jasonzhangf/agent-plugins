    unknown_protocol_variant_policy: fatal
    plugin_fallback: forbidden
    owner: upstream.client.ui_conversation
    package: '@deepseek-ai/dsh-client-ui-conversation'
    package_version: 0.1.0-rc.5
    export_path: './presentation'
    symbol: ChatSnapshotBuilder
    direction: read_projection
    scope: Chat definitions, owner-registered unknown-event business definition, and chat target builder. The TUI adds no fallback and unknown protocol variants still fail fast.
    blocking_owner: '@deepseek-ai/dsh-client-ui-conversation'
    required_export: './presentation'
    required_symbols: [registerConversationNodes, ChatSnapshotBuilder, chatViewDefinition]
    release_prerequisite: Publish the existing non-React Chat definitions and builder through ./presentation; keep their implementation owner in ui-conversation.
    planned_path: src/presentation/runtime.ts
    gate: gate.maps.references

