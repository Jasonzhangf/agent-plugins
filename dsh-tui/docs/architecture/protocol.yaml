schema_version: 1
status: design
protocol_id: protocol.tui.bridge.v1
protocol_version: 1
canonical_doc: ../detailed-design.md
machine_schema: ./protocol.schema.json

limits:
  max_record_bytes: 8388608
  max_queued_records_per_channel: 256
  max_queued_bytes_per_channel: 16777216

framing:
  length_prefix: u32_big_endian
  body: utf8_json_object
  unknown_fields: reject
  incomplete_eof: fatal

channels:
  - channel_id: channel.business_projection
    family: BusinessProjection
    schema_ref: '#/$defs/channelBusinessProjection'
    direction: host_to_child
    child_stdio_index: 3
    windows_stdio_mode: overlapped
    terminal_stream: false
  - channel_id: channel.business_action
    family: BusinessAction
    schema_ref: '#/$defs/channelBusinessAction'
    direction: child_to_host
    child_stdio_index: 4
    windows_stdio_mode: overlapped
    terminal_stream: false
  - channel_id: channel.host_control
    family: HostControl
    schema_ref: '#/$defs/channelHostControl'
    direction: host_to_child
    child_stdio_index: 5
    windows_stdio_mode: overlapped
    terminal_stream: false
  - channel_id: channel.child_control
    family: ChildControl
    schema_ref: '#/$defs/channelChildControl'
    direction: child_to_host
    child_stdio_index: 6
    windows_stdio_mode: overlapped
    terminal_stream: false

channel_location:
  transport: node_child_process_stdio_index
  raw_handle_environment: forbidden
  required_node_version: 22

business_projection_variants:
  - projection_window
  - projection_commit
  - transcript_patch
  - view_update

business_action_variants:
  - submit
  - cancel
  - session_action
  - queue_action
  - command
  - selection_action
  - interaction_response
  - settings_action

host_control_variants: [hello, delivery_ledger, ack, capacity, shutdown, fatal]
child_control_variants: [ready, delivery_ledger, ack, request_resync, capacity, shutdown, fatal]

business_transport_order:
  sequence_owner: direction_specific_control_channel
  business_sequence_field: forbidden
  ledger_variant: delivery_ledger
  rule: A business record and one same-channel delivery ledger are accepted as one FIFO pair.
  sequence_scope: each business channel and child lifetime independently starts at 1
  record_bytes: UTF-8 byte length of the decoded business JSON body, excluding the four-byte prefix
  host_control_ledger_channel: projection
  child_control_ledger_channel: action
  pending_pair_limit: ./projection-window-budget.yaml
  sequence_exhaustion: fatal
  missing_ledger_detection: EOF_or_explicit_shutdown_or_fatal_or_pending_limit_only
  forward_gap: discard_pending_and_request_resync
  rewind_or_duplicate: fatal
  fatal_and_resync_together: forbidden

forbidden_fields:
  BusinessProjection: [metadata, control, routing, retry, health, debug, shutdown, sequence, ack, completion, snapshot]
  BusinessAction: [metadata, control, routing, retry, health, debug, shutdown, sequence, ack, completion, snapshot]
  HostControl: [transcript, prompt, attachment, tool_result, session_projection]
  ChildControl: [transcript, prompt, attachment, tool_result, session_projection]

resync:
  required_after:
    - initial_handshake
    - child_restart
    - sequence_gap
    - revision_mismatch
  patch_application: atomic
  mismatch_effect: no_business_mutation

backpressure:
  projection_saturation: stop_patch_generation_and_schedule_one_windowed_projection_publication
  action_saturation: disable_submit_and_report_bridge_backpressure
  dropped_business_records: forbidden

verification_gates:
  - gate.protocol.contract
  - gate.architecture.boundaries
  - gate.terminal.restore
