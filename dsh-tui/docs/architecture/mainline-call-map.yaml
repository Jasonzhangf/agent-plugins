schema_version: 1
status: implementation
lifecycle_id: lifecycle.tui.v1
feature_id: feature.tui.surface
resource_map: ./resource-map.yaml
function_map: ./function-map.yaml
module_registry: ./module-registry.yaml
canonical_doc: ../design-spec.md

nodes:
  - node_id: TuiInputIn01TerminalEvent
    semantic: Key, paste, resize, focus, or signal from Crossterm.
    owner: feature.tui.renderer
    path: native/src/app.rs
    binding: active
  - node_id: TuiInputIn02Action
    semantic: Typed user intent independent of terminal keys.
    owner: feature.tui.renderer
    path: native/src/app.rs
    binding: active
  - node_id: TuiInputIn03BusinessActionFrame
    semantic: Rust to Node typed user intent; BusinessAction channel only.
    owner: feature.tui.bridge
    path: native/src/protocol.rs
    binding: active
  - node_id: TuiInputIn04HostOwnerCall
    semantic: Existing DSH operation invoked by its owning service.
    owner: feature.tui.host
    path: src/index.ts
    binding: active
  - node_id: TuiOutputOut01DshFact
    semantic: Session event, projection value, catalog view, or interaction view from a DSH owner.
    owner: upstream
    path: /Volumes/extension/code/dsh/packages/
    binding: bound
  - node_id: TuiOutputOut02OfficialProjection
    semantic: Official Conversation target projections produced incrementally.
    owner: feature.tui.projection_adapter
    path: src/projection.ts
    symbol: projectSession
    binding: active
  - node_id: TuiOutputOut03CanonicalCells
    semantic: Stable, terminal-neutral transcript and domain display cells.
    owner: feature.tui.projection_adapter
    path: src/projection.ts
    binding: active
  - node_id: TuiOutputOut04BusinessFrame
    semantic: Projection window, projection commit marker, or revision-fenced patch with no control fields.
    owner: feature.tui.bridge
    path: src/protocol.ts
    binding: active
  - node_id: TuiOutputOut05RenderModel
    semantic: Rust-owned local view state over canonical cells.
    owner: feature.tui.renderer
    path: native/src/model.rs
    binding: active
  - node_id: TuiOutputOut06TerminalFrame
    semantic: Ratatui frame written to the controlling terminal.
    owner: feature.tui.renderer
    path: native/src/app.rs
    binding: active
  - node_id: TuiError01BusinessError
    semantic: Error produced by the existing DSH operation owner.
    owner: upstream
    binding: bound
  - node_id: TuiError02BridgeFatal
    semantic: Protocol/version/sequence/size/process failure on the control channel.
    owner: feature.tui.bridge
    path: src/protocol.ts
    binding: active
  - node_id: TuiError03TerminalRestore
    semantic: Terminal restoration attempt and exit result.
    owner: feature.tui.renderer
    path: native/src/terminal_guard.rs
    binding: active
  - node_id: TuiRelease01CleanSource
    semantic: Clean committed dsh-tui source selected for release.
    owner: feature.tui.release
    path: scripts/release-install.mjs
    binding: active
  - node_id: TuiRelease02VersionedArtifact
    semantic: Immutable verified tarball under the global plugin release store.
    owner: feature.tui.release
    path: scripts/release-install.mjs
    binding: active
  - node_id: TuiRelease03WebProfile
    semantic: Persistent dsh-tui bundle dependency in the shipped Web profile manifest.
    owner: upstream.profile.manager
    path: ~/.dsh/profiles/web/package.json
    binding: active

edges:
  - edge_id: edge.input.01_02
    from: TuiInputIn01TerminalEvent
    to: TuiInputIn02Action
    caller: App::run_terminal
    callee: App::submit
    owner_feature: feature.tui.renderer
    binding: active
  - edge_id: edge.input.02_03
    from: TuiInputIn02Action
    to: TuiInputIn03BusinessActionFrame
    caller: App::submit
    callee: App::send_action
    owner_feature: feature.tui.renderer
    binding: active
  - edge_id: edge.input.03_04
    from: TuiInputIn03BusinessActionFrame
    to: TuiInputIn04HostOwnerCall
    caller: ActionPairReceiver.acceptPairs
    callee: handleAction
    owner_feature: feature.tui.host
    binding: active
  - edge_id: edge.output.01_02
    from: TuiOutputOut01DshFact
    to: TuiOutputOut02OfficialProjection
    caller: Session.deriveMessages
    callee: projectSession
    owner_feature: feature.tui.projection_adapter
    binding: active
  - edge_id: edge.output.02_03
    from: TuiOutputOut02OfficialProjection
    to: TuiOutputOut03CanonicalCells
    caller: projectSession
    callee: cellsForMessage
    owner_feature: feature.tui.projection_adapter
    binding: active
  - edge_id: edge.output.03_04
    from: TuiOutputOut03CanonicalCells
    to: TuiOutputOut04BusinessFrame
    caller: publishCurrentProjection
    callee: publishPublication
    owner_feature: feature.tui.bridge
    binding: active
  - edge_id: edge.output.04_05
    from: TuiOutputOut04BusinessFrame
    to: TuiOutputOut05RenderModel
    caller: DeliveryPair::accept
    callee: App::apply_projection
    owner_feature: feature.tui.bridge
    binding: active
  - edge_id: edge.output.05_06
    from: TuiOutputOut05RenderModel
    to: TuiOutputOut06TerminalFrame
    caller: App::draw
    callee: ratatui::Terminal::draw
    owner_feature: feature.tui.renderer
    binding: active
  - edge_id: edge.error.01_03
    from: TuiError01BusinessError
    to: TuiOutputOut03CanonicalCells
    caller: Session.deriveMessages
    callee: cellsForMessage
    owner_feature: feature.tui.projection_adapter
    binding: active
    rule: Business errors become canonical visible data only when the owning Web projection does so.
  - edge_id: edge.error.02_03
    from: TuiError02BridgeFatal
    to: TuiError03TerminalRestore
    caller: App::run
    callee: TerminalGuard::restore
    owner_feature: feature.tui.bridge
    binding: active
  - edge_id: edge.release.01_02
    from: TuiRelease01CleanSource
    to: TuiRelease02VersionedArtifact
    caller: main
    callee: buildRelease
    owner_feature: feature.tui.release
    binding: active
  - edge_id: edge.release.02_03
    from: TuiRelease02VersionedArtifact
    to: TuiRelease03WebProfile
    caller: main
    callee: dsh plugin --profile web add
    owner_feature: feature.tui.release
    binding: active

forbidden_shortcuts:
  - from: TuiOutputOut01DshFact
    to: TuiOutputOut05RenderModel
    reason: Rust cannot fold raw events.
  - from: TuiOutputOut02OfficialProjection
    to: TuiOutputOut06TerminalFrame
    reason: Canonical cells and the revision-fenced bridge are mandatory adjacent nodes.
  - from: TuiInputIn02Action
    to: TuiOutputOut01DshFact
    reason: Actions must pass the bridge and existing DSH owner.

gate_status:
  parseability: active
  symbol_existence: active
  adjacent_edges: active
  owner_query_consistency: active
