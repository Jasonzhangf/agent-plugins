schema_version: 1
status: implementation
feature_id: feature.tui.surface
canonical_doc: ../design-spec.md
lifecycle: ./lifecycle.yaml
verification_map: ./verification-map.yaml
projection_window_budget: ./projection-window-budget.yaml

lifecycle_paths:
  - boot -> exact binary resolution -> four-channel handshake -> complete window sequence -> atomic commit -> ready
  - official projection dirty -> coalesced flush -> patch ack -> clean
  - sequence or revision mismatch -> reject patch -> windowed projection publication -> atomic commit -> clean
  - prompt -> running -> tool and interaction facts -> terminal turn fact -> idle
  - cancel -> cancelling -> authoritative terminal fact -> idle
  - orderly or fatal shutdown -> terminal restore -> child reap -> terminated

white_box:
  - id: test.protocol.codec
    verifies: Version, frame family, sequence, revision, size, and wrong-channel rejection.
    gates: [gate.protocol.contract]
  - id: test.projection.diff
    verifies: Stable cell id/revision patches and mismatch-triggered windowed projection publication.
    gates: [gate.projection.semantic_parity]
  - id: test.markdown.display_ast
    verifies: Exact Web streaming/settled parser output normalizes to the closed display AST.
    gates: [gate.markdown.corpus]
  - id: test.renderer.terminal_guard
    verifies: Terminal modes restore exactly once on every exit path.
    gates: [gate.terminal.restore]
  - id: test.design.admission_evidence
    verifies: Clean-install package identity and release review/upload identity accept matching evidence and reject local links, integrity mismatches, ambiguous reviews, and changed trees or diffs.
    gates: [gate.implementation.admission, gate.release.admission]

module_black_box:
  - id: test.host_projection.fixture_replay
    verifies: Recorded Session input through the official Conversation owner yields canonical semantic cells equal to the Web fixture projection.
    gates: [gate.projection.semantic_parity, gate.tool.corpus]
  - id: test.bridge.duplex_process
    verifies: Four inherited channels remain single-purpose under partial writes, saturation, EOF, and early process exit.
    gates: [gate.protocol.contract]
  - id: test.renderer.real_pty
    verifies: Resize, reflow, wide characters, paste, suspend/resume, panic, and normal exit in a real PTY.
    gates: [gate.terminal.restore, gate.markdown.corpus]

project_black_box:
  - id: test.package.fresh_profile
    verifies: Packed artifacts install into an isolated DSH_HOME and initialize a custom tui profile with base plus dsh-tui.
    gates: [gate.package.install]
  - id: test.installed.real_session
    verifies: Installed package runs one real provider session across transcript, tool, cancel, resume, selections, plan/goal, approval, and question paths.
    gates: [gate.online.real_session]

corpora:
  protocol:
    - positive sample for every one of the four physical channel roots
    - wrong family and wrong direction across every channel family
    - missing required variant fields, cross-variant fields, and unknown fields
    - HostControl projection ledger and ChildControl action ledger direction lock
    - delivery ledger sequence zero, unsafe integer, and wrong protocol version
    - compatible and incompatible version
    - unknown message type
    - malformed JSON and partial record
    - oversized record and tool result
    - projection sequence gap resync, action sequence gap fatal, and base-revision mismatch
    - bounded backpressure
    - child-first and host-first exit
    - projection/action/control wrong-channel record
  markdown:
    - half emphasis and unclosed fence during streaming
    - nested list, table, task list, quote, link, and math
    - Unicode, wide CJK, emoji, combining marks, and long unbroken text
    - narrow terminal width and unknown AST node
  tools:
    - one and parallel calls
    - streamed and large JSON arguments
    - large result, error, cancellation, retry, missing or interrupted result
    - call across resume and nested Code Dispatch
    - Markdown, ANSI, and binary marker output
  terminal_restoration:
    - normal exit and Ctrl+C cancellation then exit
    - Rust panic, host EOF, protocol parse failure, and transport failure
    - resize, Unix suspend/resume, and Windows console restoration
  package_install:
    - npm pack contents and integrity manifest
    - required package realpath inside the clean install root and outside the DSH checkout
    - installed package version and lockfile registry integrity match the release artifact row
    - local link, version mismatch, missing lockfile entry, and integrity mismatch rejection
    - exact supported target selection
    - unsupported, missing, and wrong-version binary rejection before raw mode
    - fresh profile help and real-session smoke
  release_evidence:
    - uncommitted DSH Review run metadata, final semantic PASS, zero exit, and matching repository
    - explicit FAIL, blocking P0/P1, required re-review, and prompt-echo-only rejection
    - Git object ID length from the repository object format
    - uploaded commit remote-ref containment, reviewed/uploaded tree equality, and exact binary full-index diff equality

positive_negative_pairs:
  - positive: A contiguous revision-fenced patch is applied once.
    negative: A gap or base mismatch mutates no partial render state and requests resync.
  - positive: Business errors projected by the official owner remain visible business cells.
    negative: Bridge/control failures never become transcript cells or Session events.
  - positive: Streaming Markdown uses the Web GFM parser and settled Markdown uses Web GFM plus math.
    negative: Rust never reparses Markdown or flattens an unknown AST node.
  - positive: Supported packaged binaries enter and restore terminal mode.
    negative: Missing or incompatible binaries fail before terminal mutation with no fallback renderer.
  - positive: Registry package realpath, version, and lockfile integrity all match the release artifact evidence.
    negative: A checkout link, external realpath, version mismatch, or integrity mismatch cannot satisfy implementation admission.
  - positive: A passing uncommitted DSH Review and uploaded commit preserve the reviewed tree and exact diff.
    negative: A self-reported PASS, blocking finding, absent remote commit, changed tree, or changed diff cannot satisfy release admission.

fixtures:
  status: partial
  planned_paths:
    - tests/fixtures/protocol/
    - tests/fixtures/conversation/
    - tests/fixtures/markdown/
    - tests/fixtures/tools/
    - tests/fixtures/package/

known_gaps:
  - The core chat runtime, strict four-pipe codec, atomic projection model, and executable tests exist; full WebUI capability parity fixtures remain incomplete.
  - Compatible published DSH presentation and Markdown entrypoints are external dependency requirements; no plugin-local copies are permitted.
  - Phase-two release targets and Windows inherited-handle activation remain gated by their target-specific proof lanes.

sync_status: core_chat_runtime
