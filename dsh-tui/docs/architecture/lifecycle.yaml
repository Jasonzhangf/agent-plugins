schema_version: 1
status: design
lifecycle_id: lifecycle.tui.v1
owner_feature: feature.tui.surface
canonical_doc: ../design-spec.md
module_registry: ./module-registry.yaml
entrypoint: TuiAppLifecycle.booting
return_path: TuiAppLifecycle.terminated

state_axes:
  TuiAppLifecycle:
    values: [booting, ready, shutting_down, terminated]
    owner: feature.tui.host
  TuiBridgeState:
    values: [spawning, handshaking, connected, draining, failed]
    owner: feature.tui.bridge
  TuiTurnState:
    values: [idle, running, cancelling, failed]
    owner: upstream.core.agent
  TuiProjectionState:
    values: [clean, dirty, flushing, resyncing]
    owner: feature.tui.projection_adapter
  TuiInteractionState:
    values: [none, approval, question, plan_review]
    owner: upstream.interaction
  TuiToolState:
    fields:
      active_count: non_negative_integer
      failed_count: non_negative_integer
    owner: upstream.conversation.projection

transitions:
  - transition_id: lifecycle.boot.spawn
    from: { TuiAppLifecycle: booting, TuiBridgeState: spawning }
    event: exact_binary_resolved
    to: { TuiBridgeState: handshaking }
  - transition_id: lifecycle.handshake.ready
    from: { TuiAppLifecycle: booting, TuiBridgeState: handshaking }
    event: compatible_hello_ready
    to: { TuiAppLifecycle: ready, TuiBridgeState: connected, TuiProjectionState: resyncing }
  - transition_id: lifecycle.projection.commit
    from: { TuiProjectionState: resyncing }
    event: complete_projection_window_sequence_atomically_committed_and_acked
    to: { TuiProjectionState: clean }
  - transition_id: lifecycle.event.dirty
    from: { TuiProjectionState: clean }
    event: official_projection_changed
    to: { TuiProjectionState: dirty }
  - transition_id: lifecycle.frame.flush
    from: { TuiProjectionState: dirty }
    event: immediate_or_frame_deadline
    to: { TuiProjectionState: flushing }
  - transition_id: lifecycle.patch.clean
    from: { TuiProjectionState: flushing }
    event: patch_acked
    to: { TuiProjectionState: clean }
  - transition_id: lifecycle.patch.resync
    from: { TuiProjectionState: flushing }
    event: revision_mismatch_or_sequence_gap
    to: { TuiProjectionState: resyncing }
  - transition_id: lifecycle.turn.run
    from: { TuiTurnState: idle }
    event: authoritative_running_fact
    to: { TuiTurnState: running }
  - transition_id: lifecycle.turn.cancel
    from: { TuiTurnState: running }
    event: cancel_accepted
    to: { TuiTurnState: cancelling }
  - transition_id: lifecycle.turn.idle
    from: { TuiTurnState: [running, cancelling] }
    event: authoritative_terminal_turn_fact
    to: { TuiTurnState: idle }
  - transition_id: lifecycle.shutdown.begin
    from: { TuiAppLifecycle: [booting, ready] }
    event: user_shutdown_or_host_shutdown
    to: { TuiAppLifecycle: shutting_down, TuiBridgeState: draining }
  - transition_id: lifecycle.shutdown.done
    from: { TuiAppLifecycle: shutting_down }
    event: terminal_restored_and_child_reaped
    to: { TuiAppLifecycle: terminated }
  - transition_id: lifecycle.failure.restore
    from: { TuiBridgeState: [spawning, handshaking, connected, draining] }
    event: fatal_protocol_or_process_error
    to: { TuiBridgeState: failed, TuiAppLifecycle: shutting_down }

  - transition_id: lifecycle.turn.fail
    from: { TuiTurnState: [running, cancelling] }
    event: authoritative_failed_turn_fact
    to: { TuiTurnState: failed }

  - transition_id: lifecycle.turn.failed_idle
    from: { TuiTurnState: failed }
    event: failure_acknowledged_or_new_turn_ready
    to: { TuiTurnState: idle }

invariants:
  - No state axis is reconstructed from transcript text or generic metadata.
  - TuiToolState does not force TuiTurnState into a mutually exclusive awaiting-tool state.
  - A control failure cannot append or mutate a Session event.
  - A complete projection_window sequence followed by projection_commit is mandatory after initial connection, child restart, sequence gap, or revision mismatch.
  - Shutdown completes only after terminal restoration and explicit child reaping.

terminal_inputs:
  Ctrl+C:
    running: request_cancel
    idle: request_shutdown
  Ctrl+D:
    empty_composer_and_idle: request_shutdown
    otherwise: no_exit
  Escape: close_top_mode
  q:
    editing: insert_character
    explicit_navigation_mode: request_shutdown
  /quit: request_shutdown

verification_gates:
  - gate.protocol.contract
  - gate.terminal.restore
  - gate.projection.semantic_parity
  - gate.online.real_session
