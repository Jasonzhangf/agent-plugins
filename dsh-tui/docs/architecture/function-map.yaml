runtime_functions:
  - step: 1
    symbol: apply
    path: src/startup.ts
    responsibility: Parse TUI app arguments and provide immutable startup values.
    input: ctx.cmdlineArgs
    output: tuiStartup service
    status: active
  - step: 2
    symbol: apply
    path: src/index.ts
    responsibility: Await composition, resolve the exact native binary, and own the host lifecycle.
    input: tuiStartup plus DSH services
    output: one child process and one bridge
    status: active
  - step: 3
    symbol: projectSession
    path: src/projection.ts
    responsibility: Project public Session messages and live assistant chunks into terminal-neutral cells.
    input: Session.deriveMessages(), Session events, and Agent status
    output: canonical TUI cells and status view
    status: active
  - step: 4
    symbol: markdownLines
    path: src/projection.ts
    responsibility: Parse GFM Markdown in the Node host and emit terminal-neutral styled lines.
    input: Markdown text
    output: DisplayLine values
    status: active
  - step: 5
    symbol: publishPublication
    path: src/projection.ts
    responsibility: Coalesce projection changes and emit complete revisioned publications.
    input: current Agent and Session state
    output: projection_window and projection_commit records
    status: active
  - step: 6
    symbol: FrameDecoder
    path: src/protocol.ts
    responsibility: Own protocol versioning, sequence, ack, resync, and backpressure across physically separate business and control channels.
    input: typed control, projection, and action records
    output: records on the exact channel or explicit fatal error
    status: active
  - step: 7
    symbol: App::run
    path: native/src/app.rs
    responsibility: Coordinate terminal events, host frames, rendering, and orderly shutdown.
    input: decoded host frames and terminal events
    output: typed BusinessAction frames
    status: active
  - step: 8
    symbol: RenderModel::commit
    path: native/src/model.rs
    responsibility: Atomically publish one complete projection into the visible render model.
    input: staged projection windows and projection commit
    output: visible cells and views
    status: active
  - step: 9
    symbol: TerminalGuard
    path: native/src/terminal_guard.rs
    responsibility: Enter and restore every terminal mode on all termination paths.
    input: terminal handle
    output: restored terminal
    status: active
  - step: 10
    symbol: main
    path: scripts/release-install.mjs
    responsibility: Build one verified package artifact, store it under the global plugin release root, and persist it in the shipped Web profile through dsh plugin.
    input: clean dsh-tui source commit and configured plugin-store target
    output: immutable tarball plus one Web profile bundle dependency
    status: active

request_mainline:
  - terminal input is converted to a typed action by Rust
  - the BusinessAction decoder validates and delivers the action to the Node host
  - the host invokes the existing DSH owner for prompt, cancel, command, selection, or interaction response
  - accepted business effects enter existing DSH truth stores

response_mainline:
  - DSH events and projection values drive the official Conversation projection
  - canonical adapter creates stable cells and display AST
  - scheduler emits bounded patches or a complete projection window sequence
  - Rust applies revision-fenced cells and renders them

error_mainline:
  - owner business errors remain typed business responses and visible cells
  - protocol, child, sequence, and terminal failures remain direction-specific control errors
  - wrong-channel, unknown-version, malformed, oversized, or out-of-sequence records fail the bridge
  - no error is converted to success and no fallback renderer starts

shared_multi_reference_functions:
  - symbol: ConversationNodeAssembler
    owner: upstream.client.runtime.conversation
    current_allowed_callers: [upstream.web.client_runtime]
    planned_allowed_callers: [feature.tui.presentation_adapter_via_published_entrypoint]
    purpose: Single incremental event-to-view assembly engine.
  - symbol: parseGfm
    owner: upstream.client.ui_primitives
    current_allowed_callers: [upstream.web.renderer]
    planned_allowed_callers: [feature.tui.presentation_adapter_via_published_entrypoint]
