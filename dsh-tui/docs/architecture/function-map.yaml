sync_status: partial
gaps:
  - The first release covers the core chat surface; browser-only panels and rich attachments remain outside this runtime slice.
  - The Node host uses public same-process Agent and Session services and does not mount Web, Host API, or SDK transports.
  - Every authored implementation path remains under `dsh-tui/`; no planned function belongs to the DSH monorepo.
  - The release store is an operator-owned artifact directory; DSH runtime resolution remains profile-owned.
