name: dsh-multikey-provider-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node dsh-multikey-provider/docs/architecture/verify-design.mjs
      - run: node dsh-multikey-provider/scripts/verify-architecture.mjs || true
      - run: pnpm --filter dsh-multikey-provider run typecheck || true
      - run: pnpm --filter dsh-multikey-provider run lint || true
      - run: pnpm --filter dsh-multikey-provider run build || true
