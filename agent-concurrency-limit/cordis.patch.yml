# agent-concurrency-limit bundle patch: one insert over the composed tree.
# The host row mounts the guard (tools/execute + llm/stream wrappers, the
# /concurrency command, and the concurrencyLimits projection); the client row
# is the same package's browser half, discovered by client-modules via the
# dsh.client declaration. Users may override config by id.

- insert:
    - id: concurrency-limit
      name: 'agent-concurrency-limit'
      config:
        maxConcurrentToolCalls: 8
        maxConcurrentRequests: 4
